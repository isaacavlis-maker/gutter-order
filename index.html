<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order System</title>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='110' fill='%230f172a'/><path d='M256 64L64 220h48v228h288V220h48L256 64z' fill='none' stroke='%2338bdf8' stroke-width='24' stroke-linejoin='round'/><path d='M120 280h272v24H120z' fill='%23f59e0b'/><path d='M392 304v80c0 13.2-10.8 24-24 24s-24-10.8-24-24v-80' fill='none' stroke='%23f59e0b' stroke-width='20' stroke-linecap='round'/></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            background-attachment: fixed;
            color: #f8fafc;
            padding-bottom: 40px;
            font-size: 13px;
        }

        .navbar {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            color: #ffffff;
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            border-bottom: 1.5px solid #94a3b8;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar-brand { display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 800; color: #f8fafc; }
        
        .brand-logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 2px solid #f59e0b;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.25);
        }

        .company-select-nav {
            background: rgba(30, 41, 59, 0.8);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 800;
            border: 1.5px solid #64748b;
            border-radius: 8px;
            padding: 6px 12px;
            outline: none;
            cursor: pointer;
        }

        .company-select-nav option { background-color: #0f172a; color: #ffffff; }
        .nav-actions { display: flex; gap: 10px; align-items: center; }

        .btn {
            display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px;
            border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; border: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-success { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: #ffffff; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
        .btn-outline { background: rgba(30, 41, 59, 0.6); color: #e2e8f0; border: 1px solid rgba(148, 163, 184, 0.4); }

        .tabs-wrapper { max-width: 1380px; margin: 20px auto 0 auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; }
        .tab-buttons { display: flex; background: rgba(15, 23, 42, 0.6); padding: 4px; border-radius: 10px; gap: 6px; border: 1px solid rgba(148, 163, 184, 0.3); }
        .tab-btn { padding: 8px 20px; border-radius: 8px; border: none; background: transparent; font-weight: 700; color: #94a3b8; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .tab-btn.active { background: linear-gradient(135deg, #ffffff 0%, #e2e8f0 100%); color: #0f172a; border: 1px solid #cbd5e1; }

        .container { max-width: 1380px; margin: 16px auto; padding: 0 20px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .sheet-page {
            background: rgba(255, 255, 255, 0.98); color: #0f172a; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25); padding: 24px; border: 1px solid #cbd5e1; margin-bottom: 24px;
        }

        .doc-title-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid #0f172a; padding-bottom: 10px; margin-bottom: 16px; }
        .doc-title-header h1 { font-size: 22px; font-weight: 800; color: #0f172a; text-transform: uppercase; }
        .doc-title-header .doc-meta-top { font-size: 11px; color: #64748b; font-weight: 600; text-align: right; }

        .form-header-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; background-color: #f8fafc; padding: 14px; border-radius: 8px; border: 1px solid #cbd5e1; margin-bottom: 16px; }
        .form-header-grid-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; background-color: #f8fafc; padding: 14px; border-radius: 8px; border: 1.5px solid #64748b; margin-bottom: 16px; font-size: 14px; }
        .form-header-grid-summary div { font-size: 14px; color: #0f172a; font-weight: 700; }
        .form-header-grid-summary span { font-size: 16px; font-weight: 900; color: #0f172a; }

        .form-group { display: flex; flex-direction: column; gap: 4px; }
        .form-group label { font-size: 10px; font-weight: 700; color: #475569; text-transform: uppercase; }
        .form-control { padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 12px; font-weight: 600; color: #0f172a; outline: none; background-color: #ffffff; }

        .page-block-header { display: flex; justify-content: space-between; align-items: center; background: linear-gradient(135deg, #475569 0%, #1e293b 100%); color: #ffffff; padding: 6px 12px; border-radius: 6px; font-weight: 700; font-size: 12px; margin-bottom: 8px; border: 1px solid #64748b; }

        .gutter-table-wrapper { overflow-x: auto; margin-bottom: 16px; border-radius: 6px; }
        .gutter-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        
        .gutter-table th { background: linear-gradient(180deg, #64748b 0%, #475569 100%); color: #ffffff; font-weight: 700; padding: 10px 6px; text-align: center; border: 1px solid #64748b; white-space: nowrap; }
        .gutter-table th.col-item { text-align: left; padding-left: 12px; width: 220px; background: #0f172a; color: #ffffff; }
        .gutter-table th.col-summary { background: linear-gradient(180deg, #475569 0%, #334155 100%); color: #ffffff; }
        .gutter-table th.col-return { background-color: #0d9488; color: #ffffff; }

        .gutter-table td { border: 1px solid #cbd5e1; padding: 0; height: 38px; text-align: center; vertical-align: middle; background-color: #ffffff; }
        .gutter-table td.item-name { font-weight: 600; text-align: left; padding-left: 12px; color: #1e293b; background-color: #f8fafc; }

        .cell-input { width: 100%; height: 100%; padding: 6px 4px; border: none; text-align: center; font-size: 13px; font-weight: 600; background: #ffffff; outline: none; color: #0f172a; }
        .cell-auto-white { font-weight: 700; background-color: #ffffff !important; color: #0f172a; }

        .gutter-table tr:nth-child(odd) .cell-readonly, .gutter-table tr:nth-child(odd) .cell-given { font-weight: 700; background-color: #ffffff !important; color: #0f172a !important; }
        .gutter-table tr:nth-child(even) .cell-readonly, .gutter-table tr:nth-child(even) .cell-given { font-weight: 700; background-color: #f8fafc !important; color: #0f172a !important; }
        .cell-return { background-color: #ffffff; color: #0f766e; font-weight: 700; }

        .full-cell-select { width: 100%; height: 100%; border: none; background: #f8fafc; font-family: inherit; font-size: 12px; font-weight: 600; color: #1e293b; cursor: pointer; outline: none; padding: 6px 8px; }
        .wo-row td { background-color: #f8fafc !important; }
        .wo-row input { background-color: #f8fafc !important; color: #0f172a !important; font-weight: 700 !important; }

        .bottom-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; margin-top: 16px; }
        .info-card { border: 1px solid #cbd5e1; border-radius: 6px; padding: 12px; background-color: #ffffff; }
        .info-card-title { font-size: 11px; font-weight: 700; color: #475569; margin-bottom: 8px; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
        .textarea-control { width: 100%; height: 65px; border: 1px solid #cbd5e1; border-radius: 4px; padding: 8px; font-family: inherit; font-size: 12px; resize: none; outline: none; }

        .sheet-summary-container { display: flex; flex-direction: column; justify-content: space-between; min-height: 850px; }
        .sheet-summary-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .sheet-summary-table th { background: linear-gradient(180deg, #64748b 0%, #475569 100%); color: #ffffff; padding: 10px 12px; font-size: 12px; border: 1px solid #64748b; text-align: center; }
        .sheet-summary-table td { padding: 10px 12px; border: 1px solid #cbd5e1; font-size: 12.5px; text-align: center; font-weight: 600; background-color: #ffffff; color: #0f172a; }

        .unit-select-header {
            padding: 3px 6px;
            font-size: 11px;
            margin-left: 6px;
            font-weight: 800;
            display: inline-block;
            width: auto;
            background-color: #ffffff;
            color: #0f172a;
            border: 1px solid #94a3b8;
            border-radius: 4px;
            outline: none;
            cursor: pointer;
        }

        .badge-alert { background-color: #fef3c7; color: #92400e; border: 1px solid #f59e0b; padding: 14px; border-radius: 6px; font-size: 11.5px; font-weight: 600; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(6px); z-index: 1000; justify-content: center; align-items: center; }
        .modal-card { background: #ffffff; border-radius: 16px; padding: 28px 32px; max-width: 420px; width: 90%; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4); text-align: center; color: #0f172a; }
        .modal-title { font-size: 18px; font-weight: 800; color: #0f172a; margin-bottom: 8px; }
        .modal-desc { font-size: 12px; color: #64748b; margin-bottom: 20px; }
        .modal-options { display: flex; flex-direction: column; gap: 12px; }
        .btn-modal-opt { padding: 14px 18px; border-radius: 10px; font-weight: 700; font-size: 13px; cursor: pointer; border: 1px solid #cbd5e1; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-modal-color { background: linear-gradient(135deg, #64748b 0%, #475569 100%); color: #ffffff; border-color: #64748b; }
        .btn-modal-bw { background: #0f172a; color: #ffffff; border-color: #0f172a; }

        .signatures-wrapper { margin-top: 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; padding-top: 10px; }
        .sig-box { display: flex; flex-direction: column; gap: 4px; }
        .sig-line { border-bottom: 1.5px solid #0f172a; height: 28px; }
        .sig-label { display: flex; justify-content: space-between; font-size: 10px; font-weight: 700; color: #475569; text-transform: uppercase; margin-top: 4px; }
        .brand-credit { margin-top: 18px; text-align: right; font-family: 'Fira Code', 'Courier New', monospace; font-size: 13px; font-weight: 700; color: #475569; }
        .print-blank-line { display: none; border-bottom: 1px solid #0f172a; width: 120px; height: 16px; margin-left: 6px; }

        /* ==================== REGRAS DE IMPRESSÃO - FOLHA 1 TRANCADA & PAISAGEM AJUSTADA ==================== */
        @page { size: letter portrait; margin: 0.15in; }

        @media print {
            body.print-mode-color * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            body.print-mode-bw * { -webkit-print-color-adjust: economy !important; print-color-adjust: economy !important; }

            .highlight-active, .highlight-text-active {
                background-color: #fef08a !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                border: 1.5px solid #000000 !important;
                font-weight: 900 !important;
                color: #000000 !important;
            }

            html, body { background: #ffffff !important; color: #000000 !important; padding: 0 !important; margin: 0 !important; font-size: 8.5pt !important; width: 100% !important; }
            .navbar, .tabs-wrapper, .btn, .no-print, .modal-overlay { display: none !important; }
            
            .container { max-width: 100% !important; padding: 0 !important; margin: 0 !important; display: flex !important; flex-direction: column !important; width: 100% !important; }
            .tab-content { display: block !important; position: static !important; }
            .sheet-page { padding: 0 !important; border: none !important; box-shadow: none !important; margin: 0 !important; background: #ffffff !important; }

            /* 🔒 CADEADO DEFINITIVO: FOLHA 1 (REQUISITION SHEET - RETRATO 100% INTACTA) */
            #tab2 {
                order: 1 !important;
                page-break-before: avoid !important;
                page-break-after: always !important;
                break-after: page !important;
                width: 100% !important;
                height: 9.8in !important;
                display: block !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            .sheet-summary-container { display: flex !important; flex-direction: column !important; justify-content: space-between !important; height: 9.8in !important; }
            #tab2 .doc-title-header h1 { font-size: 18pt !important; font-weight: 900 !important; color: #000000 !important; }
            #tab2 .form-header-grid-summary { padding: 10px 12px !important; margin-bottom: 12px !important; font-size: 10pt !important; border: 2px solid #000000 !important; background-color: #f8fafc !important; }
            #tab2 .form-header-grid-summary div { font-size: 10pt !important; font-weight: 800 !important; color: #000000 !important; }
            #tab2 .form-header-grid-summary span { font-size: 12pt !important; font-weight: 900 !important; color: #000000 !important; }

            #tab2 .sheet-summary-table { margin-top: 10px !important; width: 100% !important; border: 2px solid #000000 !important; }
            #tab2 .sheet-summary-table th { padding: 6px 4px !important; font-size: 9.5pt !important; font-weight: 900 !important; background-color: #0f172a !important; color: #ffffff !important; border: 1.5px solid #000000 !important; }
            #tab2 .sheet-summary-table td { padding: 5px 4px !important; font-size: 10pt !important; height: 28px !important; color: #000000 !important; font-weight: 800 !important; border: 1.5px solid #000000 !important; }

            /* 📐 FOLHA 2 E 3: ORDER LIST (PAISAGEM - DESLOCADA PARA A DIREITA E PARA BAIXO) */
            #tab1 {
                order: 2 !important;
                page-break-before: always !important;
                break-before: page !important;
                width: 9.8in !important;
                height: 7.2in !important;
                display: block !important;
                transform: scale(0.85) rotate(-90deg) translate(-9.3in, -0.45in);
                transform-origin: top left;
                margin: 0 auto !important;
            }

            #page2-container {
                page-break-before: always !important;
                break-before: page !important;
                margin-top: 0 !important;
                padding-top: 10px !important;
            }

            .tab1-page-block { padding: 0 !important; border: none !important; width: 100% !important; }
            #tab1 .doc-title-header { padding-bottom: 2px !important; margin-bottom: 4px !important; border-bottom: 2px solid #000000 !important; }
            #tab1 .doc-title-header h1 { font-size: 16pt !important; font-weight: 900 !important; color: #000000 !important; }
            
            #tab1 .form-header-grid { padding: 4px 6px !important; gap: 4px !important; margin-bottom: 6px !important; width: 100% !important; border: 2px solid #000000 !important; background-color: #f8fafc !important; }
            #tab1 .form-group label { font-size: 7.5pt !important; font-weight: 800 !important; color: #000000 !important; }
            #tab1 .form-control { font-size: 8.5pt !important; font-weight: 800 !important; color: #000000 !important; }

            #tab1 .page-block-header { padding: 3px 6px !important; margin-bottom: 3px !important; font-size: 9pt !important; font-weight: 900 !important; width: 100% !important; background-color: #0f172a !important; color: #ffffff !important; border: 1.5px solid #000000 !important; }

            #tab1 .gutter-table-wrapper { margin-bottom: 4px !important; width: 100% !important; overflow: hidden !important; border: 2px solid #000000 !important; }
            #tab1 .gutter-table { table-layout: fixed !important; width: 100% !important; border-collapse: collapse !important; }
            
            #tab1 .gutter-table th.col-item { width: 18% !important; background-color: #0f172a !important; color: #ffffff !important; font-size: 8pt !important; font-weight: 900 !important; }
            #tab1 .gutter-table th:not(.col-item):not(.col-summary):not(.col-return) { width: 6.1% !important; background-color: #1e293b !important; color: #ffffff !important; font-size: 8pt !important; font-weight: 900 !important; }
            #tab1 .gutter-table th.col-summary { width: 6.8% !important; background-color: #0f172a !important; color: #ffffff !important; font-size: 8pt !important; font-weight: 900 !important; }
            #tab1 .gutter-table th.col-return { width: 6.8% !important; background-color: #0f766e !important; color: #ffffff !important; font-size: 8pt !important; font-weight: 900 !important; }

            #tab1 .gutter-table th { padding: 3px 1px !important; border: 1.5px solid #000000 !important; }
            #tab1 .gutter-table td { height: 22px !important; font-size: 8pt !important; border: 1.5px solid #000000 !important; }
            #tab1 .cell-input { font-size: 8pt !important; font-weight: 800 !important; color: #000000 !important; padding: 1px !important; }

            #tab1 .bottom-grid { margin-top: 4px !important; gap: 6px !important; width: 100% !important; }
            #tab1 .info-card { padding: 3px 6px !important; border: 2px solid #000000 !important; }
            #tab1 .info-card-title { font-size: 7.5pt !important; font-weight: 800 !important; color: #000000 !important; margin-bottom: 1px !important; }
            #tab1 .textarea-control { height: 28px !important; font-size: 8pt !important; font-weight: 700 !important; color: #000000 !important; }

            #tab1 .signatures-wrapper, #tab2 .signatures-wrapper { margin-top: 6px !important; gap: 16px !important; width: 100% !important; }
            .sig-line { height: 16px !important; border-bottom: 2px solid #000000 !important; }
            .sig-label { font-size: 7.5pt !important; font-weight: 800 !important; color: #000000 !important; }
